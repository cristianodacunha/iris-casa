# Quando a Iris anota uma ideia nova (sem dados pessoais), manda para quem cuida da Iris, se a pessoa deixou.
name: Iris envia ideias
on:
  push:
    branches: [main]
    paths: ["memoria/sugestoes.md", "memoria/licoes.md", "memoria/pessoa.md", "memoria/receitas/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iris-ideias
jobs:
  enviar:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar as ideias novas
        run: python3 .github/enviar_ideias.py
      - name: Marcar como enviadas
        run: |
          git config user.name "Iris"
          git config user.email "iris@users.noreply.github.com"
          git add memoria/.ideias_enviadas 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "Iris: ideias enviadas" && git push -q; }
